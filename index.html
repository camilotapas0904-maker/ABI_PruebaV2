<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutas de recolección</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--bg2:#f6f6f6;--tx:#333;--mu:#777;--bd:#ddd;--gr:#62cc34;--or:#fdb40b;--dk:#34495e;--rd:#e74c3c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a18;--bg2:#202522;--tx:#e6e9e6;--mu:#9aa39c;--bd:#333a35}}
:root[data-theme="dark"]{--bg:#171a18;--bg2:#202522;--tx:#e6e9e6;--mu:#9aa39c;--bd:#333a35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif;border-top:4px solid;border-image:linear-gradient(90deg,#a05cc8,#4a90e2,#62cc34,#fdb40b,#e67e22,#e74c3c) 1}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--bd);font-size:13px}
.bar button{border:0;background:none;color:var(--tx);font-size:18px}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{flex:0 0 auto;padding:10px 14px;border:0;background:none;color:var(--tx);font-size:14px;border-bottom:3px solid transparent}
nav button.on{border-color:var(--or);font-weight:700}
main{max-width:820px;margin:0 auto;padding:10px}
h1{font-weight:300;font-size:26px;text-align:center;margin:14px 0;color:var(--tx)}h1 b{font-weight:300;color:var(--or)}
h2{font-size:16px;margin:0 0 8px}
.card{border:1px solid var(--bd);padding:10px;margin-bottom:12px;background:var(--bg)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.btn{display:block;width:100%;padding:14px;border:0;font-size:20px;font-weight:300;color:#fff;background:var(--gr);margin:10px 0}
.btn.s{width:auto;display:inline-block;padding:6px 10px;font-size:12px;margin:0;font-weight:400}
.btn.o{background:var(--or)}.btn.d{background:var(--dk)}.btn.r{background:var(--rd)}
.sq.r{background:var(--rd)}.sq{border:0;color:#fff;padding:7px 10px;font-size:12px;font-weight:700;margin-right:6px}
.rt{border:1px solid var(--bd);margin-bottom:6px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;cursor:pointer;font-size:17px;font-weight:300}
.or{color:var(--or)}.mu{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px;border:1px solid var(--bd);text-align:left;vertical-align:top}th{background:var(--bg2)}
.sc{overflow-x:auto;padding:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd);white-space:nowrap}
.tag.ok{background:var(--gr);color:#fff}.tag.rj{background:var(--rd);color:#fff}.tag.nj{background:var(--or);color:#fff}
canvas{width:100%;height:150px;border:2px dashed var(--mu);background:#fff;touch-action:none;display:block}
img.f{max-width:200px;border:1px solid var(--bd);margin-top:6px}
.hide{display:none}
td input{padding:6px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
:root{--ol:#e67e22}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.05}}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:10px 0}
.big{position:relative;border:0;color:#fff;padding:34px 8px;font-size:22px;font-weight:300;cursor:pointer}
.big.sm{padding:16px 8px;font-size:16px}
.badge{position:absolute;top:-8px;right:-4px;background:var(--rd);color:#fff;border-radius:4px;font-size:13px;font-weight:700;padding:3px 7px}
.ck{width:36px;height:36px;border:0;border-radius:4px;background:var(--rd);color:#fff;font-size:22px;font-weight:700;line-height:1}
.ck.on{background:var(--gr)}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;z-index:50;padding:8px}.mbox{background:var(--bg);max-width:560px;margin:10px auto;padding:14px;border:1px solid var(--bd)}
.bar button{font-size:22px;padding:0 8px;color:var(--dk)}
.hb{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.hb .sq{width:58px;height:48px;padding:0;margin:0;border-radius:3px;display:flex;align-items:center;justify-content:center}
.ic{width:24px;height:24px;border-radius:50%;background:#fff;font-style:normal;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.hn{color:#2a9d3a;font-weight:700;font-size:12px;text-transform:uppercase}
.sec{margin:16px 0;padding:6px 12px 12px;border-left:6px solid var(--ol)}
.sec.comp{border-left-color:var(--dk);margin-top:28px}
.st{font-size:12px;letter-spacing:3px;font-weight:700;color:var(--mu);margin:6px 0 10px}
.sst{font-size:11px;color:var(--mu);margin:10px 0 2px;text-transform:uppercase;letter-spacing:1px}
/* ===== Módulo auditoría de vehículos ===== */
:root{--okc:#2e7d32;--cdc:#b26a00;--noc:#c0392b;--inc:#5d6d7e;--fr:#1a73e8}
:where(button,input,select,textarea,summary,[role=button]):focus-visible{outline:3px solid var(--fr);outline-offset:2px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;overflow:auto;padding:8px}.mc{background:var(--bg);max-width:560px;margin:10px auto;padding:14px;border:1px solid var(--bd)}
.ico{flex:none;vertical-align:-3px}
.sv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;border:1px solid currentColor;margin-left:auto}
.sv-c{color:var(--noc)}.sv-m{color:var(--cdc)}.sv-n{color:var(--mu)}
.as{border:1px solid var(--bd);margin:12px 0;background:var(--bg)}
.as>summary{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:48px;padding:8px 12px;background:var(--bg2);font-weight:700;font-size:12px;letter-spacing:.5px;cursor:pointer;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
.cnt{font-weight:700;color:var(--mu);white-space:nowrap}.cnt.done{color:var(--okc)}.cnt.hasnc{color:var(--noc)}
.ai{padding:12px;border-top:1px solid var(--bd);border-left:5px solid transparent}
.ai.ok{border-left-color:var(--okc)}.ai.nc{border-left-color:var(--noc);background:rgba(192,57,43,.05)}.ai.na{border-left-color:var(--inc)}.ai.er{outline:2px solid var(--noc);outline-offset:-2px}
.ah{display:flex;gap:8px;align-items:center}.ah .no{font-size:12px;color:var(--mu);min-width:22px}.ah b{font-size:15px}
.ac{font-size:13px;color:var(--mu);margin:4px 0 10px;line-height:1.45}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:48px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;cursor:pointer;transition:background-color .15s,border-color .15s}
.seg button:active{filter:brightness(.92)}
.seg button.on.sC{background:var(--okc);border-color:var(--okc);color:#fff}.seg button.on.sNC{background:var(--noc);border-color:var(--noc);color:#fff}.seg button.on.sNA{background:var(--inc);border-color:var(--inc);color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.ev,.dc,.dn{margin-top:10px;padding:10px;border:1px dashed var(--bd);background:var(--bg2)}
.dc.er{border-color:var(--noc)}
.ev textarea,.dn textarea{min-height:76px}
.em{color:var(--noc);font-size:13px;font-weight:700;margin:6px 0}
.mu{line-height:1.4}
.th-w{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.th{position:relative;display:inline-block}.th img{width:84px;height:84px;object-fit:cover;border:1px solid var(--bd);background:var(--bg2);display:block;cursor:zoom-in}
.th i{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-style:normal;padding:1px 4px}
.th .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--noc);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.th.s img{width:44px;height:44px}
.btn.s.ph{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:8px 14px;font-size:14px}
.btn.s.r,.btn.s.d{min-height:44px;padding:8px 14px;font-size:14px}
.dr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dr input{width:auto;min-height:44px;flex:1 1 150px}

const SUPA_URL="https://kdsbnnhxyqliytxgseye.supabase.co",SUPA_KEY="sb_publishable_DKo_JvLuv1pkGb9_uNfrIw_AbSLQ8HQ";
const DOMINIO="rutas.app"; // el usuario "juan" se guarda internamente como juan@rutas.app (no se envían correos)
let sb=null,cfgErr="";

  if(!/^https:\/\/.+\.supabase\.co/.test(SUPA_URL))throw new Error("SUPA_URL no está configurada: pega la Project URL en index.html.");

function mk(name){
  let cb=()=>{},last="";
  const load=async()=>{let q=sb.from("docs").select("data").eq("coleccion",name);if(name=="log")q=q.order("id",{ascending:false}).limit(500);
    const{data,error}=await q;if(error){console.error(error);return}const l=data.map(x=>x.data),j=JSON.stringify(l);if(j!==last){last=j;cb(l)}};
  const nm=x=>x&&(x.nombre||x.placa||x.razon)||"";
  return{load,sub:f=>{cb=f;load()},
    save:async r=>{const cond=U&&U.rol=="cond",nuevo=!(D[name]||[]).some(x=>x.id==r.id);
      const row={coleccion:name,id:r.id,data:r};
      const q=name=="log"?sb.from("docs").insert(row):cond&&name!="auditorias"?sb.from("docs").update({data:r}).eq("coleccion",name).eq("id",r.id):sb.from("docs").upsert(row);
      const{error}=await q;if(error)throw error;
      if(name!="log"&&name!="rutas"&&name!="auditorias")logE(nuevo?"Creado":"Actualizado",name+": "+nm(r));
      if(name!="log")await load()},
    del:async id=>{const x=(D[name]||[]).find(y=>y.id==id);const{error}=await sb.from("docs").delete().eq("coleccion",name).eq("id",id);
      if(error)alert("No se pudo eliminar: "+error.message);else if(name!="rutas")logE("Eliminado",name+": "+nm(x));load()}};
}
const LG=mk("log");
function logE(accion,detalle,ruta){if(!U)return Promise.resolve();
  return LG.save({id:"l"+Date.now()+Math.random().toString(36).slice(2,6),ts:new Date().toISOString(),usuario:U.nombre,rol:U.rol,accion,detalle:detalle||"",ruta:ruta||""}).then(()=>{if(S.log)S.log.load()}).catch(e=>console.error("bitácora",e))}
let started=false;
function startData(){
  if(started){Object.values(S).forEach(s=>s.load());return}started=true;
  (U.rol=="prog"?["rutas","clientes","materiales","placas","auditorias","log"]:["rutas","clientes","materiales","placas","auditorias"]).forEach(n=>{S[n]=mk(n);
    S[n].sub(l=>{D[n]=l.sort((a,b)=>n=="rutas"?(b.num||0)-(a.num||0):n=="log"?String(b.ts).localeCompare(String(a.ts)):(a.creado||0)-(b.creado||0));renderAll()})});
  sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},()=>Object.values(S).forEach(s=>s.load())).subscribe();
  setInterval(()=>{if(!document.hidden)Object.values(S).forEach(s=>s.load())},20000);
}

}

  if(error){alert("No se pudo ingresar: "+error.message);return}await afterLogin(data.user);if(U)logE("Ingreso","")};

function renderAll(){if(!U){fillLogin();return}if(U.rol=="prog"&&pdet){const r=D.rutas.find(x=>x.id==pdet);if(!r){pdet=null;setTab(tab)}else{V(win(r,false));wire()}return}const t=T[tab];t&&t.f&&t.f()}

// ---------- utilidades de rutas ----------
const matsDe=s=>D.materiales.filter(m=>m.servicio==s).map(m=>m.nombre).sort((a,b)=>a.localeCompare(b,"es"));
const hm=t=>t?new Date(t).toLocaleString("es-CO"):"";

const ultima=cod=>{let u="";D.rutas.forEach(r=>r.puntos.forEach(p=>{if(p.cod==cod&&p.estado=="cerrado"&&(p.cierre||"")>u)u=p.cierre}));return u?u.slice(0,10):""};
const kgR=r=>+r.puntos.reduce((s,p)=>s+(p.total||0),0).toFixed(1);
function rtable(r,mine,op){
  const rows=r.puntos.map((p,i)=>[p,i]).filter(x=>!op||x[0].estado=="pendiente");
  if(op&&!rows.length)return '<div class="mu" style="text-align:center;padding:16px">Todos los clientes fueron gestionados ✔</div>';
  const ck=op&&mine;
  return `<div class="sc"><table><tr>${ck?"<th></th>":""}<th>Codigo SEA</th><th>Nit</th><th>Razon Social</th><th>Ciudad</th><th>Direccion</th><th>Frecuencia</th><th>Dias</th><th>Estado Cartera</th><th>Autorizado Cartera</th><th>Ultima Recolección</th>${op?"":"<th>Estado</th><th>Detalle</th>"}</tr>`+
  rows.map(x=>{const p=x[0],i=x[1],c=D.clientes.find(z=>z.cod==p.cod)||{};
   return `<tr>${ck?`<td><button class="ck ${r.iniciada&&!r.cerrada?"on":""}" data-pt="${r.id}|${i}" title="Diligenciar">✓</button></td>`:""}<td>${esc(p.cod)}</td><td>${esc(p.nit)}</td><td>${esc(p.razon)}</td><td>${esc(p.ciudad)}</td><td>${esc(p.dir)}</td><td>${esc(c.frec)}</td><td>${esc(c.dias)}</td><td>${esc(c.cartera)}</td><td>${esc(c.aut)}</td><td>${esc(ultima(p.cod))}</td>`+
   (op?"":`<td><span class="tag ${TG[p.estado]||""}">${ST[p.estado]}</span></td><td>${p.total?p.total+" kg":""}${p.obs?`<div class="mu">${esc(p.obs)}</div>`:""}${p.foto?`<img class="f" style="max-width:70px" src="${p.foto}">${p.fotoTs?`<div class="mu">Foto: ${esc(hm(p.fotoTs))}</div>`:""}`:""}</td>`)+`</tr>`}).join("")+`</table></div>`}
const rstate=r=>r.cerrada?"FINALIZADA":r.conductor?"EN EJECUCIÓN":"PENDIENTE POR ASIGNAR";
function rcards(list){return list.map(r=>`<div class="rt"><div class="rh" data-go="${r.id}"><div>Ruta: <b>${r.num}</b> <span class="or">${esc(r.placa)}</span> :: ${esc(r.fecha)}
  <div class="mu">${esc(r.tipo)} · ${r.conductor?"Conductor: "+esc(r.conductor):"Sin asignar"} · ${rstate(r)}${r.iniciada?" · Iniciada "+esc(hm(r.iniciada)):""} · Creado:${esc(r.creadoTxt)}</div></div><span>›</span></div></div>`).join("")||'<div class="mu">Sin rutas.</div>'}
function win(r,c){
  const mine=c&&r.conductor==U.nombre,libre=!r.conductor&&!r.cerrada,pend=r.puntos.some(p=>p.estado=="pendiente"),tot=r.puntos.length,hec=tot-r.puntos.filter(p=>p.estado=="pendiente").length;
  const lg=!c?D.log.filter(l=>String(l.ruta)==String(r.num)).slice().reverse():[];
  return `<button class="btn s d" data-back>← Volver</button><h1>Ruta <b>${r.num}</b> ${esc(r.placa)}</h1><div class="mu" style="text-align:center">${esc(r.tipo)} · ${esc(r.fecha)} · ${r.conductor?"Conductor: "+esc(r.conductor):"Sin asignar"} · ${rstate(r)}${r.iniciada?" · Iniciada "+esc(hm(r.iniciada)):""} · Gestionados ${hec}/${tot}</div>`+rtable(r,mine,c)+
  (c&&libre?`<button class="btn o" data-abordar="${r.id}">ABORDAR RUTA</button>`:"")+
  (mine&&!r.cerrada&&!r.iniciada?`<div class="mu" style="text-align:center">Pulsa INICIAR RUTA para habilitar los botones de cada cliente.</div><button class="btn" data-ini="${r.id}">INICIAR RUTA</button>`:"")+
  (c&&r.conductor&&!mine&&!r.cerrada?`<div class="mu">Esta ruta fue abordada por otro conductor.</div>`:"")+
  (mine&&!r.cerrada&&r.iniciada&&!pend?`<button class="btn" data-term="${r.id}">TERMINAR RUTA</button>`:"")+
  (lg.length?`<h2 style="margin-top:14px">Movimientos de la ruta</h2><div class="sc"><table><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>${lg.map(l=>`<tr><td>${esc(hm(l.ts))}</td><td>${esc(l.usuario)}</td><td>${esc(l.accion)}</td><td>${esc(l.detalle)}</td></tr>`).join("")}</table></div>`:"")+
  (!c?`<button class="btn r" data-del="${r.id}">Eliminar ruta</button>`:"")}
function wire(){
  document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{if(U.rol=="prog")pdet=e.dataset.go;else{curId=e.dataset.go;scr="ruta"}renderAll()});

  document.querySelectorAll("[data-abordar]").forEach(e=>e.onclick=async()=>{const r=clone(D.rutas.find(x=>x.id==e.dataset.abordar));
    if(r.conductor){alert("La ruta ya fue abordada por "+r.conductor);return}
    const a=act();if(a){alert("Debes terminar primero la ruta "+a.num+" ("+a.tipo+") antes de abordar otra.");return}

    const{data,error}=await sb.from("docs").update({data:r}).eq("coleccion","rutas").eq("id",r.id).eq("data->>conductor","").select();
    if(error){err(error);return}
    S.rutas.load();if(!data.length){alert("La ruta ya fue abordada por otro conductor.");return}

    const r=clone(D.rutas.find(x=>x.id==e.dataset.term));r.cerrada=true;r.fin=new Date().toISOString();try{await S.rutas.save(r);logE("Ruta terminada","",r.num);scr="home";renderAll()}catch(x){err(x)}});
  document.querySelectorAll("[data-pt]").forEach(e=>e.onclick=()=>{const[a,b]=e.dataset.pt.split("|");const r=D.rutas.find(x=>x.id==a);

  if(await camara((u,ts)=>done(u,ts),title,tag))return;
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.setAttribute("capture","environment");
  inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;
    if(Date.now()-f.lastModified>180000){alert("La foto debe tomarse en este momento. No se aceptan fotos de la galería.");return}
    try{const ts=new Date();done(await stampUrl(await toUrl(f,800),ts,tag),ts.toISOString())}catch(x){alert(x.message)}};inp.click()}
const uiUp=()=>{const b=$("#abtn");if(b){b.disabled=Aup>0;b.dataset.l=b.dataset.l||b.textContent;b.textContent=Aup>0?"Subiendo evidencia…":b.dataset.l}};

function secHTML(){const fase=A.fase,secs=fase=="cierre"?[{t:"VERIFICACIÓN DE CARGA Y CIERRE DE JORNADA",i:CHK[A.tipo].cierre}]:CHK[A.tipo].salida;let n=0;

function wireForm(){const w=$("#aw");if(!w)return;
  w.onclick=async e=>{const t=e.target.closest("button");if(!t)return;
    if(t.id=="aback"){putA();chkHome();return}
    if(t.id=="abtn"){reviewA();return}
    if(t.dataset.r){const it=itemsOf(A.tipo,A.fase).find(x=>x.id==t.dataset.it),st=store(A,A.fase),s=st[it.id]||(st[it.id]={});s.r=s.r==t.dataset.r?"":t.dataset.r;
      if(it.docs&&!s.d){s.d={};const pv=A.docsPrev&&A.docsPrev[it.id];it.docs.forEach(k=>{if(pv&&pv[k])s.d[k]=Object.assign({},pv[k],{prev:true})})}

    if(t.dataset.ph){const id=t.dataset.ph;takePhoto("Evidencia del hallazgo",A.placa+" · "+id,(p,ts)=>{const s=store(A,A.fase)[id]||(store(A,A.fase)[id]={});(s.f=s.f||[]).push({p,ts});rerender(id)});return}
    if(t.dataset.dph){const[id,k]=t.dataset.dph.split("|");takePhoto("Documento: "+k,A.placa+" · "+k,(p,ts)=>{const s=store(A,A.fase)[id]||(store(A,A.fase)[id]={});s.d=s.d||{};s.d[k]=Object.assign(s.d[k]||{},{foto:p,ts,prev:false});rerender(id)});return}
    if(t.dataset.rm){const[id,k]=t.dataset.rm.split("|");
      if(id.startsWith("dan")){const x=A.dan[+id.slice(3)];x.f.splice(+k,1);reDan()}else{const s=store(A,A.fase)[id];s.f.splice(+k,1);rerender(id)}return}
    if(t.id=="kph"){takePhoto("Tablero: odómetro",A.placa+" · km",(p,ts)=>{A.odoF=p;A.odoTs=ts;openFormKeep()});return}
    if(t.id=="cph"){takePhoto("Tiquete / comprobante",A.placa+" · tiquete",(p,ts)=>{A.cie=A.cie||{};A.cie.foto=p;A.cie.ts=ts;openFormKeep()});return}
    if(t.id=="dadd"){(A.dan=A.dan||[]).push({z:ZONAS[0],d:"",nuevo:"Sí",f:[]});A.sinNov=false;reDan();return}
    if(t.dataset.ddel!=null){A.dan.splice(+t.dataset.ddel,1);reDan();return}
    if(t.dataset.dph2!=null){const i=+t.dataset.dph2;takePhoto("Daño o novedad",A.placa+" · novedad",(p,ts)=>{A.dan[i].f.push({p,ts});reDan()})}};
  w.oninput=e=>{const t=e.target;
    if(t.dataset.ob){const s=store(A,A.fase)[t.dataset.ob];if(s){s.ob=t.value;putA();refresh()}}
    else if(t.dataset.dd!=null){A.dan[+t.dataset.dd].d=t.value;putA();refresh()}
    else if(t.id=="ko"){A.odo=t.value;putA();refresh()}else if(t.id=="kr"){A.ruta=t.value;putA()}
    else if(t.id=="co"||t.id=="cg"||t.id=="ct"){A.cie=A.cie||{};A.cie[{co:"odo",cg:"gal",ct:"tiq"}[t.id]]=t.value;putA();refresh()}};
  w.onchange=e=>{const t=e.target;
    if(t.dataset.df){const[id,k]=t.dataset.df.split("|"),s=store(A,A.fase)[id]||(store(A,A.fase)[id]={});s.d=s.d||{};const o=s.d[k]||{};
      s.d[k]=(o.prev&&o.f==t.value)?o:{f:t.value,foto:o.f==t.value?o.foto:"",ts:o.ts};rerender(id)}

   ${A.fase=="salida"?`<div class="mu" style="margin-top:6px">Novedades: ${(A.dan||[]).length||"ninguna"} · Odómetro: ${esc(A.odo)} km</div>`:`<div class="mu" style="margin-top:6px">Tiquete ${esc(A.cie.tiq)} · ${esc(A.cie.odo)} km · ${esc(A.cie.gal)} gal</div>`}</div>
   <div class="card"><h2>Firma del conductor</h2><div style="text-align:right"><a href="#" id="sclr" class="lnk">Limpiar firma</a></div><canvas id="scv" aria-label="Recuadro de firma"></canvas>
   <label class="ck2"><input type="checkbox" id="decl"> Declaro que las respuestas y fotos corresponden al estado real del vehículo en este momento.</label><div id="serr" class="em" role="alert"></div></div>
   <button class="btn" id="asend" type="button">ENVIAR ${A.fase=="cierre"?"CIERRE":"CHEQUEO"}</button></div>`);
  const cv=$("#scv"),dpr=window.devicePixelRatio||1;cv.width=cv.offsetWidth*dpr;cv.height=150*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2;x.lineCap="round";x.strokeStyle="#111";

  $("#sclr").onclick=e=>{e.preventDefault();x.clearRect(0,0,cv.width,cv.height);sg=false};

    const t=document.createElement("canvas");t.width=300;t.height=100;t.getContext("2d").drawImage(cv,0,0,300,100);const fir=t.toDataURL("image/png"),b=$("#asend");b.disabled=true;b.textContent="Guardando…";
    try{await saveA(c,fir)}catch(e){b.disabled=false;b.textContent="REINTENTAR ENVÍO";err(e)}}}
async function saveA(c,fir){const nuevo=A.fase=="salida",ts=new Date().toISOString();
  if(nuevo){Object.assign(A,{v:c.v,ncC:c.ncC,ncM:c.ncM,firma:fir,ts,creado:Date.now(),num:Math.max(0,...D.auditorias.map(x=>x.num||0))+1});delete A.docsPrev}
  else{A.cie=Object.assign(A.cie,{ts:ts,v:c.v,ncC:c.ncC,ncM:c.ncM,firma:fir,odo:+A.cie.odo,gal:+A.cie.gal})}
  const rec=clone(A);delete rec.fase;await S.auditorias.save(rec);
  await logE(nuevo?"Chequeo vehículo":"Cierre jornada vehículo",`${A.placa} · ${nuevo?c.v:"cierre "+c.v} · ${c.ncC} crít / ${c.ncM} may`,A.ruta||"");
  const v=c.v;clrA();Am="done";
  V(`<div id="aw"><div class="vban ${vcls(v)}">${vic(v)}<div><b>${nuevo?"Chequeo enviado":"Cierre enviado"}</b><div>${esc(v)}</div></div></div>
   ${nuevo&&v!=VER.ok?`<div class="card"><b>${v==VER.no?"No salga con este vehículo.":"No salga hasta tener la autorización."}</b><div class="mu">Avise ahora al Coordinador de Logística. Él registra la decisión en ABI.</div></div>`:""}
   <button class="btn" id="aok">VOLVER</button></div>`);$("#aok").onclick=chkHome}

// ---- Conductor: pestaña de chequeo ----
const chkHome=()=>{T.chk.b();T.chk.f()};
const placasT=()=>D.placas.filter(p=>ATIPO.includes(p.tipo));
function newA(placa,fase){const p=D.placas.find(x=>x.placa==placa),r=D.rutas.find(x=>x.conductor==U.nombre&&!x.cerrada&&x.placa==placa);
  A={id:"a"+Date.now(),fase:"salida",placa,tipo:p.tipo,fecha:hoy(),conductor:U.nombre,ruta:r?String(r.num):"",it:{},dan:[],ver:"v4",docsPrev:lastDocs(placa)};openForm()}
T.chk={b(){Am="home";V('<div id="clk"></div>')},
 f(){const el=$("#clk");if(!el||Am!="home")return;
  const dr=getA(),mias=D.auditorias.filter(a=>a.conductor==U.nombre&&a.fecha==hoy()).sort((a,b)=>b.creado-a.creado),pl=placasT();
  el.innerHTML=`<h1>Chequeo de vehículo</h1>

   <div class="card"><h2>Nuevo chequeo de salida</h2>${pl.length?`<label for="apl">Vehículo (placa)</label><select id="apl">${pl.map(p=>`<option value="${esc(p.placa)}">${esc(p.placa)} · ${esc(p.tipo)}</option>`).join("")}</select><div id="ainf" class="mu"></div><button class="btn" id="ago">INICIAR CHEQUEO</button>`:'<div class="mu">No hay placas con tipo de vehículo. Pídale al programador que defina el tipo (RESPEL o APROVECHABLE) en Placas.</div>'}</div>
   <div class="card"><h2>Mis chequeos de hoy</h2>${mias.map(a=>`<div class="chk"><div style="flex:1"><b>${esc(a.placa)}</b> <span class="vv ${vcls(a.dec||a.v)}">${esc(a.dec||a.v)}</span><div class="mu">${hm(a.ts)} · ${a.cie?"Jornada cerrada":"Cierre de jornada pendiente"}</div></div>${a.cie?"":`<button class="btn s o" data-cz="${a.id}">Cerrar jornada</button>`}</div>`).join("")||'<div class="mu">Aún no ha hecho chequeos hoy.</div>'}</div>`;
  const dc=$("#dcont");if(dc){dc.onclick=()=>{A=getA();openForm()};$("#ddesc").onclick=()=>{if(confirm("¿Descartar el borrador? Se pierde lo diligenciado.")){clrA();T.chk.f()}}}
  const ap=$("#apl");if(ap){const inf=()=>{const e=estPlaca(ap.value),a=e.a;$("#ainf").textContent=a?`Hoy ya hay un chequeo de esta placa (${a.conductor}, ${hm(a.ts)}).`:"Aún no tiene chequeo hoy."};ap.onchange=inf;inf();
    $("#ago").onclick=()=>{if(getA()&&!confirm("Hay un borrador sin enviar. Si inicia uno nuevo se pierde. ¿Continuar?"))return;const e=estPlaca(ap.value);if(e.a&&!confirm("Esta placa ya tiene chequeo hoy. ¿Hacer otro?"))return;newA(ap.value)}}
  document.querySelectorAll("[data-cz]").forEach(b=>b.onclick=()=>{const a=D.auditorias.find(x=>x.id==b.dataset.cz);A=Object.assign(clone(a),{fase:"cierre",cz:a.cz||{},cie:a.cie||{}});openForm()})}};

// ---- Programador: panel de auditoría ----
const vTag=(v)=>`<span class="vv ${vcls(v)}">${vic(v)} ${esc(v)}</span>`;
T.aud={b(){Aview="flota";Asel=null;V('<div id="aud"></div>')},
 f(){const el=$("#aud");if(!el)return;
  if(Asel&&el.contains(document.activeElement)&&/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(Asel){const a=D.auditorias.find(x=>x.id==Asel);if(a)return detA(el,a);Asel=null}
  const f=Af,tabs=[["flota","Estado de flota"],["lista","Historial"],["venc","Vencimientos"]];
  const head=`<h1>Auditoría de vehículos</h1><div class="atabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${Aview==t[0]}" class="${Aview==t[0]?"on":""}" data-av="${t[0]}">${t[1]}</button>`).join("")}</div>`;
  let body="";
  if(Aview=="flota"){const ps=D.placas.map(p=>({p,e:ATIPO.includes(p.tipo)?estPlaca(p.placa):{key:"notipo"}}));
    const cnt=k=>ps.filter(x=>x.e.key==k).length,pdec=ps.filter(x=>x.e.pend).length;
    body=`<div class="kpi"><div class="k apto"><b>${cnt("apto")}</b>Aptos</div><div class="k cond"><b>${cnt("cond")}</b>Condicionados</div><div class="k no"><b>${cnt("no")}</b>No aptos</div><div class="k inc"><b>${cnt("sin")}</b>Sin chequeo</div></div>
     ${pdec?`<div class="vban cond">${IC.warn}<div><b>${pdec} decisión(es) pendiente(s)</b><div>Chequeos con hallazgos esperando al Coordinador.</div></div></div>`:""}
     ${ps.sort((x,y)=>(y.e.pend?1:0)-(x.e.pend?1:0)||"nosincondapto".indexOf(x.e.key)-"nosincondapto".indexOf(y.e.key)).map(({p,e})=>{const dv=docsPlaca(p.placa).filter(d=>d.dd<=30).sort((a,b)=>a.dd-b.dd);
      return `<div class="fl ${e.key}"><div class="fh"><b>${esc(p.placa)}</b><span class="tag">${esc(p.tipo||"Sin tipo")}</span>${e.a?vTag(e.txt):e.key=="notipo"?'<span class="vv inc">Defina el tipo en Placas</span>':'<span class="vv inc">SIN CHEQUEO HOY</span>'}</div>
       ${e.a?`<div class="mu">${esc(e.a.conductor)} · ${hm(e.a.ts)} · ${e.a.ncC} crít / ${e.a.ncM} may${e.cierre?" · cierre pendiente":""}</div>`:""}
       ${dv.length?`<div class="chips">${dv.map(d=>`<span class="dv ${d.dd<0?"bad":"warn"}">${esc(d.k)} ${d.dd<0?"vencido":"vence en "+d.dd+" d"}</span>`).join("")}</div>`:""}
       ${e.a?`<button class="btn s ${e.pend?"o":"d"}" data-ad="${e.a.id}">${e.pend?"Decidir":"Ver chequeo"}</button>`:""}</div>`}).join("")||'<div class="mu">Sin placas.</div>'}`}
  else if(Aview=="lista"){const l=D.auditorias.filter(a=>(!f.placa||a.placa==f.placa)&&(!f.d1||a.fecha>=f.d1)&&(!f.d2||a.fecha<=f.d2)&&(!f.est||(a.dec||a.v)==f.est)).sort((a,b)=>b.creado-a.creado);
    body=`<div class="card"><div class="row"><div><label for="fp">Placa</label><select id="fp"><option value="">Todas</option>${D.placas.map(p=>`<option${p.placa==f.placa?" selected":""}>${esc(p.placa)}</option>`).join("")}</select></div><div><label for="fe">Dictamen</label><select id="fe"><option value="">Todos</option>${Object.values(VER).map(v=>`<option${v==f.est?" selected":""}>${esc(v)}</option>`).join("")}</select></div></div>
     <div class="row"><div><label for="f1">Desde</label><input type="date" id="f1" value="${f.d1}"></div><div><label for="f2">Hasta</label><input type="date" id="f2" value="${f.d2}"></div></div>
     <button class="btn o" id="acsv">Descargar hallazgos (CSV)</button></div><p><b>${l.length} chequeo(s)</b></p>
     ${l.map(a=>`<div class="rt"><div class="rh" data-ad="${a.id}" role="button" tabindex="0"><div><b>${esc(a.placa)}</b> <span class="mu">${esc(a.fecha)} · ${esc(a.conductor)}</span><div>${vTag(a.dec||a.v)}</div></div><span class="or">${a.ncC+a.ncM} NC</span></div></div>`).join("")||'<div class="mu">Sin resultados.</div>'}`}
  else{const rows=[];D.placas.forEach(p=>docsPlaca(p.placa).forEach(d=>rows.push({p:p.placa,...d})));rows.sort((a,b)=>a.dd-b.dd);
    body=`<div class="card sc"><table><tr><th>Placa</th><th>Documento</th><th>Vence</th><th>Estado</th></tr>${rows.map(d=>`<tr><td>${esc(d.p)}</td><td>${esc(d.k)}</td><td>${esc(d.f)}</td><td><span class="dv ${d.dd<0?"bad":d.dd<=30?"warn":"ok"}">${d.dd<0?"Vencido hace "+-d.dd+" d":d.dd<=30?"Vence en "+d.dd+" d":"Vigente · "+d.dd+" d"}</span></td></tr>`).join("")||'<tr><td colspan="4">Sin datos. Se alimenta de los chequeos.</td></tr>'}</table></div><div class="mu">Fechas tomadas del último chequeo de cada placa.</div>`}
  el.innerHTML=head+body;
  el.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{Aview=b.dataset.av;T.aud.f()});
  el.querySelectorAll("[data-ad]").forEach(b=>{b.onclick=()=>{Asel=b.dataset.ad;T.aud.f()};b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();b.click()}}});
  if(Aview=="lista"){const set=()=>{Af={placa:$("#fp").value,est:$("#fe").value,d1:$("#f1").value,d2:$("#f2").value};T.aud.f()};["fp","fe","f1","f2"].forEach(i=>$("#"+i).onchange=set);$("#acsv").onclick=csvA}}};
function csvA(){const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""').replace(/\r?\n/g," ")+'"',R=[["Fecha","Placa","Tipo","Conductor","Fase","N.º","Componente","Severidad","Resultado","Observación","Fotos","Dictamen","Decisión Coordinador"]];
  D.auditorias.filter(a=>(!Af.placa||a.placa==Af.placa)&&(!Af.d1||a.fecha>=Af.d1)&&(!Af.d2||a.fecha<=Af.d2)&&(!Af.est||(a.dec||a.v)==Af.est)).forEach(a=>["salida","cierre"].forEach(fase=>{let n=0;
    lg(a,fase).forEach(it=>{n++;const s=store(a,fase)[it.id]||{},r=efRes(it,s);if(r=="NC")R.push([a.fecha,a.placa,a.tipo,a.conductor,fase,n,it.c,it.s,r,s.ob||"Documento vencido",nFot(s),a.v,a.dec||""])});
    if(fase=="salida")(a.dan||[]).forEach(x=>R.push([a.fecha,a.placa,a.tipo,a.conductor,"novedad","",x.z,"",x.nuevo=="Sí"?"Daño nuevo":"Novedad",x.d,(x.f||[]).length,a.v,a.dec||""]))}));
  dl.save({filename:"hallazgos_vehiculos_"+hoy()+".csv",data:"﻿"+R.map(r=>r.map(q).join(";")).join("\r\n")})}
function detA(el,a){const dec=a.dec||"";
  const secs=CHK[a.tipo].salida;let n=0;
  const itRow=(it,fase)=>{n++;const s=store(a,fase)[it.id]||{},r=efRes(it,s);
    return `<tr class="${r=="NC"?"rnc":""}"><td>${n}</td><td><b>${esc(it.c)}</b>${r=="NC"&&s.ob?`<div>${esc(s.ob)}</div>`:""}${(it.docs||[]).map(k=>{const d=(s.d||{})[k];return d&&d.f?`<div class="mu">${esc(k)}: ${esc(d.f)}${d.foto?` <span class="th s"><img data-ev="${esc(d.foto)}" alt="${esc(k)}"></span>`:""}</div>`:""}).join("")}${(s.f||[]).length?`<div class="th-w">${thumbs(s.f)}</div>`:""}</td><td><span class="sv sv-${SVC[it.s]}">${it.s}</span></td><td><b>${r||"—"}</b></td></tr>`};
  el.innerHTML=`<button class="btn s d" id="adb">← Volver</button><h1 style="margin:10px 0 2px">${esc(a.placa)} · ${esc(a.tipo)}</h1><div class="mu" style="text-align:center">Chequeo ${a.num||""} · ${esc(a.fecha)} · ${esc(a.conductor)} · ${hm(a.ts)}${a.ruta?" · ruta "+esc(a.ruta):""} · ${esc(a.odo)} km</div>
   <div class="vban ${vcls(dec||a.v)}">${vic(dec||a.v)}<div><b>${esc(dec||a.v)}</b><div>Dictamen automático: ${esc(a.v)} · ${a.ncC} crítico(s) · ${a.ncM} mayor(es)</div></div></div>
   <div class="card"><h2>Decisión del Coordinador de Logística</h2>
    <label for="adc">Decisión final</label><select id="adc">${Object.values(VER).map(v=>`<option${(dec||a.v)==v?" selected":""}>${esc(v)}</option>`).join("")}</select>
    <div id="aal" class="vban no hide" style="margin:8px 0">${IC.warn}<div><b>Decisión menos restrictiva que el dictamen</b><div>Justifique por escrito; queda en la bitácora.</div></div></div>
    <label for="acd">Condiciones / justificación / plazo de corrección</label><textarea id="acd">${esc(a.cond||"")}</textarea><div id="aer" class="em" role="alert"></div>
    <button class="btn" id="adg">REGISTRAR DECISIÓN</button>${a.decPor?`<div class="mu">Última decisión: ${esc(a.decPor)} · ${hm(a.decTs)}</div>`:""}</div>
   ${(a.dan||[]).length?`<div class="card"><h2>Daños y novedades</h2>${a.dan.map(x=>`<div class="chk"><div><b>${esc(x.z)}</b> · ${x.nuevo=="Sí"?"Daño nuevo":"Novedad"}<div>${esc(x.d)}</div><div class="th-w">${thumbs(x.f)}</div></div></div>`).join("")}</div>`:""}
   <div class="card sc"><h2>Chequeo de salida</h2><table><tr><th>#</th><th>Componente / evidencia</th><th>Sev.</th><th>Res.</th></tr>${(n=0,secs.map(sec=>`<tr><th colspan="4">${esc(sec.t)}</th></tr>`+sec.i.map(it=>itRow(it,"salida")).join("")).join(""))}</table></div>

   ${a.cie?`<div class="card sc"><h2>Cierre de jornada · ${hm(a.cie.ts)}</h2><div class="mu">${esc(a.cie.odo)} km (${a.cie.odo-a.odo} recorridos) · ${esc(a.cie.gal)} gal${+a.cie.gal>0?" · "+((a.cie.odo-a.odo)/a.cie.gal).toFixed(1)+" km/gal":""} · tiquete ${esc(a.cie.tiq)}</div><div class="th-w">${thumbs([{p:a.cie.foto,ts:a.cie.ts}])}</div><table>${(n=0,CHK[a.tipo].cierre.map(it=>itRow(it,"cierre")).join(""))}</table></div>`:'<div class="card"><h2>Cierre de jornada</h2><div class="mu">Pendiente.</div></div>'}
   <div class="card"><h2>Firma del conductor</h2><img class="f" alt="Firma" src="${a.firma||""}" style="background:#fff"></div>

  hydrate(el);$("#adb").onclick=()=>{Asel=null;T.aud.f()};
  const al=()=>$("#aal").classList.toggle("hide",!(RK[$("#adc").value]<RK[a.v]));$("#adc").onchange=al;al();
  $("#adg").onclick=async()=>{const d=$("#adc").value,c=$("#acd").value.trim(),menos=RK[d]<RK[a.v];
    if((menos||d!=VER.ok)&&!c){$("#aer").textContent=menos?"Justifique por qué la decisión es menos restrictiva que el dictamen.":"Indique las condiciones o el motivo.";return}
    $("#aer").textContent="";const b=$("#adg");b.disabled=true;
    try{await S.auditorias.save(Object.assign(clone(a),{dec:d,cond:c,decPor:U.nombre,decTs:new Date().toISOString()}));await logE("Decisión chequeo",`${a.placa} · ${d}${menos?" · MENOS RESTRICTIVA QUE EL DICTAMEN":""} · ${c}`);Asel=null;T.aud.f()}catch(e){err(e)}finally{b.disabled=false}}}

 $("#padd").onclick=async()=>{const n=$("#pn").value.trim().toUpperCase();if(!n)return;if(D.placas.some(p=>p.placa==n)){alert("Esa placa ya existe.");return}

 f(){$("#pl").innerHTML=D.placas.map(p=>`<div class="chk"><b>${esc(p.placa)}</b><select data-pt="${p.id}" aria-label="Tipo de vehículo de ${esc(p.placa)}" style="width:auto;margin-left:8px">${p.tipo?"":'<option value="">Definir tipo…</option>'}${ATIPO.map(t=>`<option${p.tipo==t?" selected":""}>${t}</option>`).join("")}</select><button class="btn s r" style="margin-left:auto" data-dp="${p.id}">Eliminar</button></div>`).join("")||'<div class="mu">Sin placas.</div>';
