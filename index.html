<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutas de recolección</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--bg2:#f6f6f6;--tx:#333;--mu:#777;--bd:#ddd;--gr:#62cc34;--or:#fdb40b;--dk:#34495e;--rd:#e74c3c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a18;--bg2:#202522;--tx:#e6e9e6;--mu:#9aa39c;--bd:#333a35}}
:root[data-theme="dark"]{--bg:#171a18;--bg2:#202522;--tx:#e6e9e6;--mu:#9aa39c;--bd:#333a35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif;border-top:4px solid;border-image:linear-gradient(90deg,#a05cc8,#4a90e2,#62cc34,#fdb40b,#e67e22,#e74c3c) 1}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--bd);font-size:13px}
.bar button{border:0;background:none;color:var(--tx);font-size:18px}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{flex:0 0 auto;padding:10px 14px;border:0;background:none;color:var(--tx);font-size:14px;border-bottom:3px solid transparent}
nav button.on{border-color:var(--or);font-weight:700}
main{max-width:820px;margin:0 auto;padding:10px}
h1{font-weight:300;font-size:26px;text-align:center;margin:14px 0;color:var(--tx)}h1 b{font-weight:300;color:var(--or)}
h2{font-size:16px;margin:0 0 8px}
.card{border:1px solid var(--bd);padding:10px;margin-bottom:12px;background:var(--bg)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.btn{display:block;width:100%;padding:14px;border:0;font-size:20px;font-weight:300;color:#fff;background:var(--gr);margin:10px 0}
.btn.s{width:auto;display:inline-block;padding:6px 10px;font-size:12px;margin:0;font-weight:400}
.btn.o{background:var(--or)}.btn.d{background:var(--dk)}.btn.r{background:var(--rd)}
.sq.r{background:var(--rd)}.sq{border:0;color:#fff;padding:7px 10px;font-size:12px;font-weight:700;margin-right:6px}
.rt{border:1px solid var(--bd);margin-bottom:6px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;cursor:pointer;font-size:17px;font-weight:300}
.or{color:var(--or)}.mu{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px;border:1px solid var(--bd);text-align:left;vertical-align:top}th{background:var(--bg2)}
.sc{overflow-x:auto;padding:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd);white-space:nowrap}
.tag.ok{background:var(--gr);color:#fff}.tag.rj{background:var(--rd);color:#fff}.tag.nj{background:var(--or);color:#fff}
canvas{width:100%;height:150px;border:2px dashed var(--mu);background:#fff;touch-action:none;display:block}
img.f{max-width:200px;border:1px solid var(--bd);margin-top:6px}
.hide{display:none}
td input{padding:6px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
:root{--ol:#e67e22}

function rtable(r,mine,op){
  const rows=r.puntos.map((p,i)=>[p,i]).filter(x=>!op||x[0].estado=="pendiente");
  if(op&&!rows.length)return '<div class="mu" style="text-align:center;padding:16px">Todos los clientes fueron gestionados ✔</div>';

   return `<tr>${ck?`<td><button class="ck ${r.iniciada&&!r.cerrada?"on":""}" data-pt="${r.id}|${i}" title="Diligenciar">✓</button></td>`:""}<td>${esc(p.cod)}</td><td>${esc(p.nit)}</td><td>${esc(p.razon)}</td><td>${esc(p.ciudad)}</td><td>${esc(p.dir)}</td><td>${esc(c.frec)}</td><td>${esc(c.dias)}</td><td>${esc(c.cartera)}</td><td>${esc(c.aut)}</td><td>${esc(ultima(p.cod))}</td>`+

function win(r,c){
  const mine=c&&r.conductor==U.nombre,libre=!r.conductor&&!r.cerrada,pend=r.puntos.some(p=>p.estado=="pendiente"),tot=r.puntos.length,hec=tot-r.puntos.filter(p=>p.estado=="pendiente").length;

  return `<button class="btn s d" data-back>← Volver</button><h1>Ruta <b>${r.num}</b> ${esc(r.placa)}</h1><div class="mu" style="text-align:center">${esc(r.tipo)} · ${esc(r.fecha)} · ${r.conductor?"Conductor: "+esc(r.conductor):"Sin asignar"} · ${rstate(r)}${r.iniciada?" · Iniciada "+esc(hm(r.iniciada)):""} · Gestionados ${hec}/${tot}</div>`+rtable(r,mine,c)+

T.con={b(){V(`<div class="card"><h2>Conductores</h2><div class="row"><div><label>Nombre</label><input id="nn"></div><div><label>Clave</label><input id="np" inputmode="numeric"></div></div><button class="btn" id="nadd">Agregar conductor</button></div><div class="card" id="nlist"></div>`);
 $("#nadd").onclick=async()=>{const n=$("#nn").value.trim(),p=$("#np").value.trim();if(!n||!p){alert("Nombre y clave son obligatorios.");return}
  try{await S.conductores.save({id:"u"+Date.now(),nombre:n,pin:p,creado:Date.now()});$("#nn").value=$("#np").value=""}catch(e){err(e)}}},
 f(){$("#nlist").innerHTML=D.conductores.map(c=>`<div class="chk">${esc(c.nombre)}<button class="btn s r" style="margin-left:auto" data-du="${c.id}">Eliminar</button></div>`).join("")||'<div class="mu">Sin conductores.</div>';
  document.querySelectorAll("[data-du]").forEach(b=>b.onclick=()=>S.conductores.del(b.dataset.du))}};

// ---------- reporte ----------
const rr=()=>D.rutas.filter(r=>(!$("#d1").value||r.fecha>=$("#d1").value)&&(!$("#d2").value||r.fecha<=$("#d2").value));
const cnt=(r,e)=>r.puntos.filter(p=>p.estado==e).length;
T.rep={b(){V(`<div class="card"><h2>Reporte de lo realizado</h2><div class="row"><div><label>Desde</label><input type="date" id="d1"></div><div><label>Hasta</label><input type="date" id="d2"></div></div><button class="btn o" id="csv">Descargar CSV (Excel)</button></div><div id="rep"></div>`);
 $("#d1").onchange=$("#d2").onchange=()=>T.rep.f();
 $("#csv").onclick=async()=>{
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',k=v=>String(v).replace(".",","),rows=[["Ruta","Fecha","Placa","Conductor","Servicio","Código","NIT","Razón social","Ciudad","Dirección","Estado","Material","Kg","Obs. material","Quien entrega","Email","Obs. punto","Cierre"]];
  rr().forEach(r=>r.puntos.forEach(p=>{const b=[r.num,r.fecha,r.placa,r.conductor,r.tipo,p.cod,p.nit,p.razon,p.ciudad,p.dir,ST[p.estado]];const t=[p.entrega,p.email,p.obs,p.cierre];
   if(p.estado=="cerrado"&&p.items)Object.keys(p.items).forEach(m=>rows.push(b.concat([m,k(p.items[m].kg),p.items[m].obs],t)));else rows.push(b.concat(["","",""],t))}));
  if(!dl){alert("La descarga no está disponible aquí.");return}
  try{await dl.save({filename:"reporte_recoleccion.csv",data:"\ufeff"+rows.map(r=>r.map(q).join(";")).join("\n")})}catch(e){if(!e||e.code!="declined")err(e)}}},
 f(){const l=rr(),tm={};l.forEach(r=>r.puntos.forEach(p=>p.items&&Object.keys(p.items).forEach(m=>tm[r.tipo+" · "+m]=(tm[r.tipo+" · "+m]||0)+p.items[m].kg)));
  $("#rep").innerHTML=`<div class="card sc"><table><tr><th>Ruta</th><th>Fecha</th><th>Placa</th><th>Conductor</th><th>Servicio</th><th>Recol.</th><th>Ausentes</th><th>No term.</th><th>Pend.</th><th>Kg</th></tr>`+
   l.map(r=>`<tr><td>${r.num}</td><td>${esc(r.fecha)}</td><td>${esc(r.placa)}</td><td>${esc(r.conductor||"—")}</td><td>${esc(r.tipo)}</td><td>${cnt(r,"cerrado")}</td><td>${cnt(r,"ausente")}</td><td>${cnt(r,"no_terminado")}</td><td>${cnt(r,"pendiente")}</td><td>${kgR(r)}</td></tr>`).join("")+
   `<tr><th colspan="9">Total kg</th><th>${+l.reduce((s,r)=>s+kgR(r),0).toFixed(1)}</th></tr></table></div><div class="card sc"><table><tr><th>Material</th><th>Kg</th></tr>`+
   Object.keys(tm).sort().map(m=>`<tr><td>${esc(m)}</td><td>${+tm[m].toFixed(1)}</td></tr>`).join("")+`</table></div>`}};

// ---------- conductor ----------
const act=s=>D.rutas.find(r=>r.conductor==U.nombre&&!r.cerrada&&(!s||r.tipo==s));
T.cond={b(){V('<div id="clst"></div>')},
 f(){const el=$("#clst");
  if(draft&&el){const r=D.rutas.find(x=>x.id==draft.rid);if(r){const d=draft;draft=null;curId=d.rid;scr="ruta";ptIdx=d.i;openAlt(clone(r),d.i,d.kind);$("#ob").value=d.ob||"";putD(d);return}}
  if(ptIdx!==null||!el)return;
  if(scr=="home"){
   el.innerHTML="<h1>Rutas Programadas</h1><div class=\"g4\">"+SERV.map(s=>{const a=act(s),n=D.rutas.filter(r=>!r.conductor&&!r.cerrada&&r.tipo==s).length;
    return `<button class="big" style="background:${a?"var(--ol)":"var(--gr)"}" data-sv="${s}">${s}${a?'<div style="font-size:13px">RUTA ACTIVA</div>':""}<span class="badge">${n}</span></button>`}).join("")+"</div>";
   document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{fsv=b.dataset.sv;const a=act(fsv);if(a){curId=a.id;scr="ruta"}else scr="list";T.cond.f()})}
  else if(scr=="list"){const l=filtra(D.rutas.filter(r=>!r.conductor&&!r.cerrada&&r.tipo==fsv));
   el.innerHTML=`<button class="btn s d" data-back>← Volver</button>`+lh("Rutas Programadas - <b>"+fsv+"</b>")+`<p><b>Resultado total: ${l.length} - ${fsv}</b></p>`+rcards(l);lbind();wire()}
  else{const r=D.rutas.find(x=>x.id==curId);if(!r){scr="home";T.cond.f();return}el.innerHTML=win(r,true);wire()}}};

// ---------- diligenciar punto ----------
async function saveRuta(r){try{await S.rutas.save(r)}catch(e){err(e);return false}clrD();ptIdx=null;scr="ruta";T.cond.b();T.cond.f();return true}
function head(r,p,btns){return `<h1 style="margin:6px 0 8px">RECOLECCIÓN - ${esc(r.tipo)}</h1><div class="hb">`+
  (btns?`<button class="sq r" id="aus" title="Cliente ausente" aria-label="Cliente ausente"><i class="ic" style="color:var(--rd)">!</i></button><button class="sq" style="background:var(--or)" id="nt" title="No terminar" aria-label="No terminar"><i class="ic" style="color:var(--or)">!</i></button>`:"")+
  `<span class="hn">${esc(p.razon)}</span></div><div class="mu" style="text-align:center">${esc(p.cod)} · NIT ${esc(p.nit)} · ${esc(p.ciudad)} · ${esc(p.dir)}</div>`}
let dg={};
function cancelDig(){if(!confirm("¿Cancelar la digitación? Se perderán los datos ingresados."))return;const m=$("#mdl");if(m)m.remove();dg={};clrD();ptIdx=null;T.cond.b();T.cond.f()}
function openPt(i,keep){
  const r=clone(D.rutas.find(x=>x.id==curId)),p=r.puntos[i];r.mats.sort((a,b)=>a.localeCompare(b,"es"));ptIdx=i;if(!keep)dg={};
  const g=k=>dg[k]||{};
  V(head(r,p,true)+`<div class="mu" style="text-align:center">Resultados: ${r.mats.length} Residuos asignados</div>
   <table style="margin-top:8px"><tr><th>Residuo</th><th>Cant (Kg)</th><th>Observación</th></tr>`+
   r.mats.map((m,k)=>`<tr><td>${esc(m)}</td><td><input type="number" inputmode="decimal" step="0.1" min="0" data-kg="${k}" value="${esc(g(k).kg||"")}"></td><td><input data-ob="${k}" value="${esc(g(k).obs||"")}"></td></tr>`).join("")+
   `<tr><th>Total Kg</th><th colspan="2" id="tot">0</th></tr></table>
   <button class="btn" id="cont">CONTINUAR</button><button class="btn d" id="canc">✕ Cancelar</button>`);
  const rd=()=>{const o={};r.mats.forEach((m,k)=>{o[k]={kg:document.querySelector(`[data-kg="${k}"]`).value,obs:document.querySelector(`[data-ob="${k}"]`).value.trim()}});return o};
  const upd=()=>{$("#tot").textContent=[...document.querySelectorAll("[data-kg]")].reduce((s,e)=>s+(parseFloat(e.value)||0),0).toFixed(1)};
  document.querySelectorAll("[data-kg]").forEach(e=>e.oninput=upd);upd();
  $("#canc").onclick=cancelDig;
  $("#aus").onclick=()=>{dg=Object.assign(rd(),{_:dg._});openAlt(r,i,"ausente")};$("#nt").onclick=()=>{dg=Object.assign(rd(),{_:dg._});openAlt(r,i,"no_terminado")};
  $("#cont").onclick=()=>{dg=Object.assign(rd(),{_:dg._});const tot=r.mats.reduce((s,m,k)=>s+(parseFloat(dg[k].kg)||0),0);
    if(!tot){alert("Registra el peso de al menos un residuo.");return}resumen(r,i)}
}
function resumen(r,i){
  const p=r.puntos[i],it=r.mats.map((m,k)=>[m,parseFloat(dg[k].kg)||0,dg[k].obs]).filter(x=>x[1]>0),tot=+it.reduce((s,x)=>s+x[1],0).toFixed(1),_=dg._||{};
  const m=document.createElement("div");m.id="mdl";m.className="mdl";
  m.innerHTML=`<div class="mbox"><h2 style="text-align:center;font-weight:300;font-size:20px">RESUMEN DE RECOLECCIÓN</h2><div class="mu" style="text-align:center">${esc(p.razon)}</div>
   <table style="margin-top:8px"><tr><th>Residuo</th><th>Kg</th><th>Obs.</th></tr>${it.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td><td>${esc(x[2])}</td></tr>`).join("")}<tr><th>Total Kg</th><th colspan="2">${tot}</th></tr></table>
   <label>Comentarios</label><textarea id="cm">${esc(_.cm||"")}</textarea>
   <div style="text-align:center;margin:8px 0 4px"><a href="#" id="clr" style="color:#2a9d3a;font-weight:700">Limpiar Firma</a></div><canvas id="cv"></canvas>
   <label>Quien entrega</label><input id="ent" value="${esc(_.ent||"")}"><label>Email principal</label><input id="mail" type="email" value="${esc(_.mail||"")}">
   <button class="btn" id="cons">CONSOLIDAR</button>
   <div class="row"><button class="btn o" id="edt">✎ EDITAR</button><button class="btn r" id="cx">✕ CANCELAR</button></div></div>`;
  document.body.appendChild(m);
  const cv=$("#cv"),dpr=window.devicePixelRatio||1;cv.width=cv.offsetWidth*dpr;cv.height=150*dpr;
  const x=cv.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2;x.lineCap="round";x.strokeStyle="#111";signed=false;
  if(_.f){const im=new Image();im.onload=()=>x.drawImage(im,0,0,cv.offsetWidth,150);im.src=_.f;signed=true}
  let d=false;const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{d=true;signed=true;cv.setPointerCapture(e.pointerId);const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke()};cv.onpointerup=()=>{d=false};
  $("#clr").onclick=e=>{e.preventDefault();x.clearRect(0,0,cv.width,cv.height);signed=false};
  $("#edt").onclick=()=>{dg._={cm:$("#cm").value,ent:$("#ent").value,mail:$("#mail").value,f:signed?cv.toDataURL():null};m.remove();openPt(i,true)};
  $("#cx").onclick=cancelDig;
  $("#cons").onclick=async()=>{
    if(!$("#ent").value.trim()){alert("Indica quién entrega.");return}
    if(!signed){alert("Falta la firma.");return}
    const items={};it.forEach(y=>{items[y[0]]={kg:y[1],obs:y[2]}});
    const t=document.createElement("canvas");t.width=300;t.height=100;t.getContext("2d").drawImage(cv,0,0,300,100);
    Object.assign(p,{estado:"cerrado",items,total:tot,obs:$("#cm").value.trim(),entrega:$("#ent").value.trim(),email:$("#mail").value.trim(),firma:t.toDataURL("image/png"),cierre:new Date().toISOString()});
    if(await saveRuta(r)){m.remove();dg={};logE("Punto recolectado",p.razon+" · "+tot+" kg",r.num)}
  };
}
function toUrl(f,max=640){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error("No se pudo leer la imagen"));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("Imagen no válida"));im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};im.src=fr.result};fr.readAsDataURL(f)})}
function openAlt(r,i,kind){
  const p=r.puntos[i],aus=kind=="ausente";foto=null;
  V(head(r,p,false)+`<div class="card" style="margin-top:10px"><h2>${aus?"CLIENTE AUSENTE (se visitó, no se recolectó)":"NO TERMINAR (no se visitó)"}</h2>
   ${aus?`<label>Foto</label><label class="btn s d" style="color:#fff;display:inline-block;margin-right:6px;font-size:13px">Tomar foto<input type="file" accept="image/*" capture="environment" style="display:none" data-ph></label><label class="btn s d" style="color:#fff;display:inline-block;font-size:13px">Cargar de galería<input type="file" accept="image/*" style="display:none" data-ph></label><div class="mu" style="margin-top:6px">Si al abrir la cámara la página se recarga, lo escrito se conserva; vuelve a tomar la foto.</div><div><img id="pv" class="f hide"></div>`:""}
   <label>Observación (obligatoria)</label><textarea id="ob"></textarea></div>
   <div class="row"><button class="btn o" id="ok">CONFIRMAR</button><button class="btn d" id="vol">CANCELAR</button></div>`);
  putD({rid:curId,i,kind,ob:""});$("#ob").oninput=()=>putD({rid:curId,i,kind,ob:$("#ob").value});
  document.querySelectorAll("[data-ph]").forEach(inp=>inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{foto=await toUrl(f);$("#pv").src=foto;$("#pv").classList.remove("hide")}catch(x){alert(x.message)}});
  $("#vol").onclick=()=>{clrD();openPt(i,true)};
  $("#ok").onclick=async()=>{const ob=$("#ob").value.trim();
    if(!ob){alert("La observación es obligatoria.");return}
    if(aus&&!foto&&!confirm("No hay foto cargada. ¿Continuar sin foto?"))return
    Object.assign(p,{estado:kind,obs:ob,cierre:new Date().toISOString()});if(aus)p.foto=foto;if(await saveRuta(r))logE(aus?"Cliente ausente":"No terminado",p.razon+" · "+ob,r.num)}
}
init();
</script></body></html>
